<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c5f78">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cube Boum</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#173b4d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
/* ---------- barre du haut ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:linear-gradient(#2a7f9e,#1c5f78);box-shadow:0 4px 0 #0f3e50;z-index:5}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fdeccb;color:#5a3a12;font-weight:900;border-radius:16px;padding:6px 10px;font-size:20px;box-shadow:inset 0 -4px 0 #e1c48f;min-height:44px}
.pill .ic{font-size:24px;line-height:1}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcf2e 45%,#d99000);box-shadow:inset 0 -2px 0 #b77400,0 1px 0 #00000033;position:relative}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #fff3;}
.round{width:48px;height:48px;border-radius:50%;border:none;background:#3c9bbd;box-shadow:inset 0 -4px 0 #236a85;font-size:24px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- carte ---------- */
#mapScroll{flex:1;overflow-y:auto;position:relative;background:
 radial-gradient(circle at 20% 20%,#ffffff14 0 40px,transparent 41px) 0 0/160px 160px,
 radial-gradient(circle at 70% 60%,#ffffff10 0 26px,transparent 27px) 0 0/130px 130px,
 linear-gradient(#5b3fa8,#2f7fa8 50%,#2e9e8a)}
#path{position:relative;width:100%}
#path svg{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 #0005;border:none}
.node.done{background:radial-gradient(circle at 40% 30%,#9ff0c0,#2fae6a);box-shadow:inset 0 -5px 0 #1d7a48,0 4px 0 #0004}
.node.lock{background:radial-gradient(circle at 40% 30%,#d6dde6,#8a97a8);box-shadow:inset 0 -5px 0 #5f6b7a,0 4px 0 #0004}
.node.cur{width:92px;height:92px;margin:-46px 0 0 -46px;font-size:18px;background:radial-gradient(circle at 40% 30%,#ffd1a0,#ff7a3c);box-shadow:inset 0 -6px 0 #c74b14,0 0 0 6px #fff8,0 6px 0 #0004;animation:pulse 1.4s infinite}
.node .st{font-size:12px;letter-spacing:-1px;color:#ffe14d}
.node .lbl{position:absolute;bottom:-26px;white-space:nowrap;font-size:17px;background:#0006;padding:1px 8px;border-radius:10px}
@keyframes pulse{50%{transform:scale(1.07)}}
.side{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 84px);display:flex;flex-direction:column;gap:14px;z-index:4}
.sideBtn{width:70px;height:70px;border-radius:50%;border:none;background:radial-gradient(circle at 40% 30%,#6fd0ef,#2a86ad);box-shadow:inset 0 -5px 0 #1c5f78,0 4px 0 #0004;font-size:32px;position:relative;color:#fff}
.sideBtn small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;background:#1c5f78;padding:2px 7px;border-radius:8px;white-space:nowrap}
.dot{position:absolute;top:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#ff3b3b;border:3px solid #fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.playBar{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(#2a7f9e,#1c5f78);box-shadow:0 -4px 0 #0f3e50}
.big{width:100%;border:none;border-radius:20px;padding:16px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#8ee35a,#4cb52a);box-shadow:inset 0 -6px 0 #2f8a17,0 4px 0 #0004;text-shadow:0 2px 0 #0004}
.big:active,.sideBtn:active,.round:active,.bst:active{transform:translateY(2px)}
/* ---------- jeu ---------- */
#game{background:
 radial-gradient(circle at 15% 25%,#ffffff12 0 50px,transparent 51px) 0 0/180px 180px,
 linear-gradient(#6a4bb8,#3b6fb0 45%,#2b8f9c)}
.hud{display:flex;align-items:stretch;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:#1c5f78;box-shadow:0 4px 0 #0f3e50;z-index:3}
.goals{flex:1.4;display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#fdeccb;border-radius:16px;padding:6px;box-shadow:inset 0 -4px 0 #e1c48f;min-height:84px}
.goal{display:flex;align-items:center;justify-content:center;gap:4px;color:#3b2a10;font-weight:900;font-size:22px;position:relative}
.goal.bump{animation:bump .25s}
.goal .ok{color:#2fae3a;font-size:26px}
@keyframes bump{50%{transform:scale(1.3)}}
.gi{width:32px;height:32px;position:relative;flex:none}
.gi>div{position:absolute;inset:0;margin:0}
.gi .emo{font-size:28px;line-height:32px}
.lvlBox{flex:.8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-shadow:0 2px 0 #0005}
.lvlBox small{font-size:13px;opacity:.85}
.lvlBox b{font-size:21px}
.lvlBox .tntOn{margin-top:4px;font-size:11px;background:#e33;padding:2px 8px;border-radius:8px;box-shadow:inset 0 -2px 0 #a11}
.movesBox{flex:1;background:#fdeccb;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3b2a10;box-shadow:inset 0 -4px 0 #e1c48f}
.movesBox small{font-weight:900;font-size:13px;color:#7a5520}
.movesBox b{font-size:44px;line-height:1;font-weight:900}
.movesBox.low b{color:#e33;animation:bump .6s infinite}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#board{position:relative}
#cells,#tiles,#fx{position:absolute;inset:0}
#tiles{overflow:hidden}
#fx{pointer-events:none;overflow:visible}
.cell{position:absolute;background:#0d2f4acc;border-radius:6px}
.cell.alt{background:#123a58cc}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .27s cubic-bezier(.55,0,.85,.55);will-change:transform}
.tile.fast{transition:transform .15s ease-in}
.tile>*{position:absolute;inset:5%}
.tile.pop{animation:pop .24s forwards}
.tile.born{animation:born .35s}
.tile.nudge>*:first-child{animation:nudge .3s}
.tile.sel{filter:brightness(1.35)}
@keyframes pop{to{opacity:0;scale:.2}}
@keyframes born{0%{scale:.2}70%{scale:1.2}100%{scale:1}}
@keyframes nudge{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
.cube{border-radius:22%;background:linear-gradient(160deg,var(--a),var(--b) 55%,var(--d));box-shadow:inset 0 -.28em 0 #0003,inset 0 .2em 0 #ffffff66,0 2px 2px #0003;font-size:calc(var(--cell)*.18);display:flex;align-items:center;justify-content:center}
.cube svg{width:62%;height:62%}
.hint{inset:auto 2% 2% auto!important;width:42%;height:42%;pointer-events:none}
.hint svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px #0008)}
.sp svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0005)}
.rocket.v svg{transform:rotate(90deg)}
.tnt{border-radius:16%;background:linear-gradient(#ff6a5a,#d8231b 60%,#9e1010);box-shadow:inset 0 -.25em 0 #0004,inset 0 .2em 0 #fff5;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.3)}
.tnt::before{content:"";position:absolute;left:0;right:0;top:34%;height:32%;background:#fff3}
.tnt span{position:relative;font-weight:900;color:#fff;text-shadow:0 2px 0 #6a0000;letter-spacing:.02em}
.disco{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 30%),conic-gradient(#ff4a4a,#ffc21a,#38c94a,#2f86f0,#9b51f5,#ff4a4a);box-shadow:inset 0 -.2em 0 #0003,0 0 8px #fff8;animation:spin 3s linear infinite}
@keyframes spin{to{rotate:360deg}}
.stone{border-radius:34% 40% 30% 38%;background:radial-gradient(circle at 30% 30%,#f2f4f7,#b9c3cf 55%,#7d8a99);box-shadow:inset 0 -.25em 0 #0002,0 2px 2px #0003}
.stone::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 12% 9% at 66% 60%,#8d99a888 90%,transparent),radial-gradient(ellipse 9% 7% at 30% 70%,#8d99a866 90%,transparent)}
.crate{border-radius:10%;background:repeating-linear-gradient(180deg,#d9954a 0 30%,#a8642a 30% 33.3%);border:.18em solid #7a4518;box-shadow:inset 0 0 0 .12em #f0b56e66,0 2px 2px #0003}
.crate::before{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 44%,#8a501f 44% 56%,transparent 56%)}
.crate.hp1::after{content:"";position:absolute;inset:15%;background:linear-gradient(120deg,transparent 45%,#3a1d06 46% 50%,transparent 51%),linear-gradient(30deg,transparent 47%,#3a1d06 48% 51%,transparent 52%)}
.safe{border-radius:14%;background:linear-gradient(150deg,#eef3f7,#a9b6c2 55%,#6f7d8b);box-shadow:inset 0 -.25em 0 #0003,inset 0 .15em 0 #fff8,0 2px 2px #0003}
.safe i{position:absolute;left:25%;top:22%;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,#4b6a8a 0 22%,#9fb6cc 24% 52%,#3c5570 54%);box-shadow:0 0 0 .12em #2fb35a}
.safe b{position:absolute;bottom:2%;left:0;right:0;text-align:center;font-size:calc(var(--cell)*.2);color:#2a3a4a;line-height:1}
.safe.hp2 i{box-shadow:0 0 0 .12em #ffb020}.safe.hp1 i{box-shadow:0 0 0 .12em #ff4040}
.hive{border-radius:45% 45% 30% 30%;background:repeating-linear-gradient(180deg,#ffc44a 0 18%,#e8901a 18% 22%);box-shadow:inset 0 -.25em 0 #0003,inset 0 .2em 0 #fff6,0 2px 2px #0003}
.hive i{position:absolute;left:36%;top:44%;width:28%;height:24%;border-radius:50%;background:#5a2c00}
.hive.hp1{filter:saturate(.6) brightness(.95)}
/* effets */
.fx-line{position:absolute;background:linear-gradient(90deg,transparent,#fff 15%,#ffe36a 50%,#fff 85%,transparent);box-shadow:0 0 18px #ffe36a;border-radius:20px;animation:lineH .42s forwards}
.fx-line.v{background:linear-gradient(180deg,transparent,#fff 15%,#ffe36a 50%,#fff 85%,transparent);animation:lineV .42s forwards}
@keyframes lineH{0%{transform:scaleX(.05);opacity:1}60%{opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes lineV{0%{transform:scaleY(.05);opacity:1}60%{opacity:1}100%{transform:scaleY(1);opacity:0}}
.fx-boom{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,#ffd23a 35%,#ff6a1a 60%,transparent 70%);animation:boom .45s forwards}
@keyframes boom{0%{transform:scale(.1);opacity:1}100%{transform:scale(1);opacity:0}}
.part{position:absolute;width:12px;height:12px;border-radius:3px;animation:part .5s ease-out forwards}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.bee{position:fixed;font-size:28px;z-index:50;transition:all .7s cubic-bezier(.4,-0.3,.6,1);pointer-events:none}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:42px;font-weight:900;color:#fff;text-shadow:0 4px 0 #c74b14,0 0 20px #000a;pointer-events:none;opacity:0;transform:scale(.5);transition:all .3s;z-index:6}
#banner.show{opacity:1;transform:scale(1)}
#tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:14px;font-weight:800;font-size:16px;white-space:nowrap;z-index:6}
/* barre des boosters */
.bbar{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px 8px calc(env(safe-area-inset-bottom) + 12px);background:#1c5f78;box-shadow:0 -4px 0 #0f3e50}
.bst{width:62px;height:62px;border-radius:16px;border:none;background:linear-gradient(#7fdc5a,#46ad2c);box-shadow:inset 0 -5px 0 #2f8017;font-size:30px;position:relative;color:#fff;display:flex;align-items:center;justify-content:center}
.bst.on{background:linear-gradient(#ffd36a,#ff9c1a);box-shadow:inset 0 -5px 0 #c86a00,0 0 0 4px #fff}
.bst .n{position:absolute;right:-4px;bottom:-6px;min-width:24px;height:24px;padding:0 5px;border-radius:12px;background:#fff;color:#2f6a12;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0003}
.bst .n.plus{background:#ffcf2e;color:#6a4100}
.bst.gear{background:#fdeccb;box-shadow:inset 0 -5px 0 #e1c48f;color:#1c5f78}
.bst svg{width:70%;height:70%}
/* fenêtres */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.box{background:#fdeccb;color:#3b2a10;border-radius:24px;padding:20px 18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:inset 0 -6px 0 #e1c48f,0 10px 30px #0008;text-align:center}
.box h2{margin:0 0 12px;font-size:28px;color:#c74b14}
.box p{font-size:18px;margin:8px 0 14px;line-height:1.35}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;margin:10px 0 0;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#8ee35a,#4cb52a);box-shadow:inset 0 -5px 0 #2f8a17;text-shadow:0 2px 0 #0003}
.btn.blue{background:linear-gradient(#6fd0ef,#2a86ad);box-shadow:inset 0 -5px 0 #1c5f78}
.btn.red{background:linear-gradient(#ff7b6a,#e0342a);box-shadow:inset 0 -5px 0 #a11}
.btn.grey{background:linear-gradient(#c9d1da,#8d99a8);box-shadow:inset 0 -5px 0 #5f6b7a}
.btn:disabled{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:2px solid #e9d3a8;font-size:19px;font-weight:800}
.sw{width:62px;height:34px;border-radius:17px;background:#c9b48f;position:relative;border:none;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#4cb52a}.sw.on::after{left:32px}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0}
.stars .off{opacity:.25;filter:grayscale(1)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.card{aspect-ratio:3/4;border-radius:16px;border:4px solid #f1b03a;background:linear-gradient(#7fd3f0,#3aa0cc);font-size:48px;font-weight:900;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;text-shadow:0 3px 0 #0003;transition:transform .3s}
.card.rev{background:#fff4dc;color:#3b2a10;font-size:30px;text-shadow:none}
.card.rev small{font-size:18px;font-weight:900;color:#2a86ad}
.card.mine{box-shadow:0 0 0 4px #fff,0 0 22px #ffd23a;transform:scale(1.06)}
.card.dim{opacity:.5}
.shopRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px solid #e9d3a8}
.shopRow .ico{width:52px;height:52px;border-radius:14px;background:linear-gradient(#7fdc5a,#46ad2c);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.shopRow .ico svg{width:70%;height:70%}
.shopRow .txt{flex:1;text-align:left;font-weight:800;font-size:17px}
.shopRow .txt small{display:block;color:#7a5520;font-weight:700}
.shopRow button{border:none;border-radius:12px;padding:10px 12px;font-weight:900;font-size:17px;background:linear-gradient(#ffe06a,#ffb31a);box-shadow:inset 0 -4px 0 #c88400;color:#5a3a00;display:flex;align-items:center;gap:6px}
input[type=number]{width:100%;font-size:24px;padding:10px;border-radius:12px;border:3px solid #e1c48f;text-align:center;font-weight:900;color:#3b2a10;background:#fff;user-select:text;-webkit-user-select:text}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:#000c;color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;font-size:18px;z-index:200;pointer-events:none;transition:opacity .3s;opacity:0;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===================== CARTE ===================== -->
<section id="map" class="screen">
  <div class="topbar">
    <div class="pill"><span class="ic">❤️</span><span>∞ Illimité</span></div>
    <div class="pill"><span class="coin"></span><span id="coinsMap">0</span></div>
    <button class="round" id="btnSettings" aria-label="Réglages">⚙️</button>
  </div>
  <div class="side">
    <button class="sideBtn" id="btnBonus">🎁<small>Bonus</small><span class="dot hidden" id="bonusDot">!</span></button>
    <button class="sideBtn" id="btnShop">🛒<small>Boutique</small></button>
  </div>
  <div id="mapScroll"><div id="path"></div></div>
  <div class="playBar"><button class="big" id="btnPlay">Jouer</button></div>
</section>

<!-- ===================== JEU ===================== -->
<section id="game" class="screen hidden">
  <div class="hud">
    <div class="goals" id="goals"></div>
    <div class="lvlBox"><small>Niveau</small><b id="lvlNum">1</b><span class="tntOn">TNT ✓</span></div>
    <div class="movesBox" id="movesBox"><small>Coups</small><b id="moves">0</b></div>
  </div>
  <div id="boardWrap">
    <div id="board"><div id="cells"></div><div id="tiles"></div><div id="fx"></div></div>
    <div id="banner"></div>
    <div id="tip" class="hidden"></div>
  </div>
  <div class="bbar" id="bbar"></div>
</section>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* ====================== DONNÉES / SAUVEGARDE ====================== */
const KEY='cubeboum_save_v1';
const START_LEVEL=11482;
const COLS=9, ROWS=10;
const CCOL=[['#ff9a8a','#f23b3b','#b01818'],['#9ccdff','#2f86f0','#1a52aa'],['#9af08c','#2fbf3f','#1c8428'],['#fff09a','#ffc21a','#d08a00'],['#dcb4ff','#9b51f5','#6a2bc0']];
const SYMP='fill="#ffffff8c" stroke="#00000026" stroke-width="5" stroke-linejoin="round"';
const SYM=[
 `<svg viewBox="0 0 100 100"><polygon ${SYMP} points="50,10 62,37 91,39 68,58 76,87 50,71 24,87 32,58 9,39 38,37"/></svg>`,
 `<svg viewBox="0 0 100 100"><path ${SYMP} d="M50 10C50 10 22 45 22 62a28 28 0 0 0 56 0C78 45 50 10 50 10Z"/></svg>`,
 `<svg viewBox="0 0 100 100"><polygon ${SYMP} points="50,14 88,82 12,82"/></svg>`,
 `<svg viewBox="0 0 100 100"><circle ${SYMP} cx="50" cy="50" r="30"/></svg>`,
 `<svg viewBox="0 0 100 100"><polygon ${SYMP} points="50,8 88,50 50,92 12,50"/></svg>`];
const ROCKET=`<svg viewBox="0 0 100 100"><rect x="22" y="36" width="56" height="28" rx="12" fill="#ffe7a0" stroke="#b05a00" stroke-width="4"/><polygon points="22,32 4,50 22,68" fill="#ff5a3a" stroke="#a02010" stroke-width="4" stroke-linejoin="round"/><polygon points="78,32 96,50 78,68" fill="#ff5a3a" stroke="#a02010" stroke-width="4" stroke-linejoin="round"/><circle cx="50" cy="50" r="8" fill="#3a8dff" stroke="#1a4a9a" stroke-width="3"/></svg>`;
const BOMB=`<svg viewBox="0 0 100 100"><circle cx="46" cy="58" r="32" fill="#2b2f3a" stroke="#0e1016" stroke-width="4"/><circle cx="36" cy="46" r="9" fill="#ffffff55"/><rect x="56" y="18" width="16" height="16" rx="3" transform="rotate(40 64 26)" fill="#596070"/><path d="M68 20 Q76 8 86 12" stroke="#c07a2a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="88" cy="11" r="7" fill="#ffd23a"/><circle cx="88" cy="11" r="3" fill="#fff"/></svg>`;

const ROWIC=`<svg viewBox="0 0 100 100"><rect x="6" y="38" width="88" height="24" rx="10" fill="#ffe7a0" stroke="#b05a00" stroke-width="4"/><path d="M20 50h60M20 50l10-8M20 50l10 8M80 50l-10-8M80 50l-10 8" stroke="#c0390f" stroke-width="6" stroke-linecap="round" fill="none"/></svg>`;

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1600)}
let AC=null;
function snd(type){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 const tone=(f1,f2,dur,wave,vol,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(f1,t+delay);o.frequency.exponentialRampToValueAtTime(f2,t+delay+dur);g.gain.setValueAtTime(vol,t+delay);g.gain.exponentialRampToValueAtTime(.001,t+delay+dur);o.start(t+delay);o.stop(t+delay+dur+.02)};
 if(type==='pop')tone(480+Math.random()*180,950,.11,'triangle',.22);
 else if(type==='rocket')tone(260,1400,.22,'sawtooth',.09);
 else if(type==='boom'){tone(160,35,.38,'sawtooth',.22);tone(90,30,.4,'square',.12)}
 else if(type==='disco'){[0,.05,.1,.15].forEach((d,i)=>tone(600+i*200,900+i*200,.12,'triangle',.12,d))}
 else if(type==='bad')tone(220,160,.12,'square',.08);
 else if(type==='hit')tone(300,200,.08,'square',.08);
 else if(type==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,f,.22,'triangle',.18,i*.12))}
 else if(type==='lose'){[392,330,262].forEach((f,i)=>tone(f,f*.95,.25,'triangle',.15,i*.18))}
 else if(type==='coin')tone(900,1500,.12,'triangle',.15);
}catch(e){}}
function buzz(ms){if(S.vibe&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

/* ====================== MOTEUR ====================== */
const HP={stone:1,crate:2,safe:3,hive:2};
const isObs=t=>!!t&&HP[t.t]!==undefined;
const isSp=t=>!!t&&(t.t==='rh'||t.t==='rv'||t.t==='bomb'||t.t==='tnt'||t.t==='disco');
const isCube=t=>!!t&&t.t==='c';
let nid=1;
const mk=(t,x)=>Object.assign({id:nid++,t},x||{});
let G=null, CELL=40;
const els=new Map();

function genLevel(L){
 const R=rng(L*7919+31);
 const pick=a=>a[Math.floor(R()*a.length)];
 const nC=(L%5===0)?4:5;
 const mask=[...Array(ROWS)].map(()=>Array(COLS).fill(true));
 const off=(r,c)=>{mask[r][c]=false;mask[r][COLS-1-c]=false};
 const shape=Math.floor(R()*6);
 if(shape===1){off(0,0);off(0,1);off(1,0)}
 else if(shape===2){off(4,4);off(5,4)}
 else if(shape===3){off(4,0);off(5,0)}
 else if(shape===4){off(9,0);off(9,1);off(0,0)}
 else if(shape===5){off(3,0);off(6,0)}
 const grid=[...Array(ROWS)].map(()=>Array(COLS).fill(null));
 const put=(r,c,t)=>{if(r<0||r>=ROWS||c<0||c>4)return;if(!mask[r][c]||grid[r][c])return;grid[r][c]=mk(t,{hp:HP[t]});const m=COLS-1-c;if(m!==c)grid[r][m]=mk(t,{hp:HP[t]})};
 const types=['stone','crate','safe','hive'];
 for(let i=types.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[types[i],types[j]]=[types[j],types[i]]}
 const chosen=types.slice(0,L%3===0?3:2);
 for(const t of chosen){
  const st=pick(['row','sides','block','row2']);
  if(st==='row'){const r=1+Math.floor(R()*8),a=Math.floor(R()*3);for(let c=a;c<=4;c++)put(r,c,t)}
  else if(st==='row2'){const r=1+Math.floor(R()*7);for(let c=1;c<=4;c++){put(r,c,t);put(r+1,c,t)}}
  else if(st==='sides'){const w=1+Math.floor(R()*2),r1=Math.floor(R()*5),h=3+Math.floor(R()*3);for(let r=r1;r<r1+h;r++)for(let c=0;c<w;c++)put(r,c,t)}
  else{const r1=2+Math.floor(R()*5),h=2+Math.floor(R()*2),w=1+Math.floor(R()*2);for(let r=r1;r<r1+h;r++)for(let c=5-w;c<=4;c++)put(r,c,t)}
 }
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(mask[r][c]&&!grid[r][c])grid[r][c]=mk('c',{c:Math.floor(R()*nC)});
 // TNT toujours activée au départ
 const cand=[];for(let r=4;r<=8;r++)for(let c=2;c<=6;c++)if(mask[r][c]&&isCube(grid[r][c]))cand.push([r,c]);
 if(cand.length){const [r,c]=pick(cand);grid[r][c]=mk('tnt')}
 const cnt={stone:0,crate:0,safe:0,hive:0};let totalHp=0;
 for(const row of grid)for(const t of row)if(isObs(t)){cnt[t.t]++;totalHp+=t.hp}
 const goals=[];let colorN=0;
 for(const t of chosen)if(cnt[t])goals.push({k:t==='hive'?'bee':t,n:t==='hive'?cnt[t]*HP.hive:cnt[t]});
 if(goals.length<4&&(R()<.7||!goals.length)){colorN=15+Math.floor(R()*16);goals.push({k:'c'+Math.floor(R()*nC),n:colorN})}
 const moves=Math.max(20,Math.min(42,Math.round(16+totalHp*.3+colorN*.3)));
 return{level:L,nC,mask,grid,moves,startMoves:moves,goals};
}

const inB=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&G.mask[r][c];
const K=(r,c)=>r*COLS+c;
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
function flood(r,c,same){const t0=G.grid[r][c];const out=[[r,c]],seen=new Set([K(r,c)]),st=[[r,c]];
 while(st.length){const [a,b]=st.pop();for(const [dr,dc] of N4){const na=a+dr,nb=b+dc;if(!inB(na,nb))continue;const k=K(na,nb);if(seen.has(k))continue;const t=G.grid[na][nb];if(same(t,t0)){seen.add(k);out.push([na,nb]);st.push([na,nb])}}}
 return out}
const sameCube=(t,t0)=>isCube(t)&&t.c===t0.c;
const allCells=()=>{const o=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.mask[r][c])o.push([r,c]);return o};
const rowCells=r=>{const o=[];for(let c=0;c<COLS;c++)o.push([r,c]);return o};
const colCells=c=>{const o=[];for(let r=0;r<ROWS;r++)o.push([r,c]);return o};
const circle=(r,c,r2)=>{const o=[];for(let a=0;a<ROWS;a++)for(let b=0;b<COLS;b++)if((a-r)**2+(b-c)**2<=r2)o.push([a,b]);return o};
function mostColor(){const n=[0,0,0,0,0];for(const row of G.grid)for(const t of row)if(isCube(t))n[t.c]++;let best=0;for(let i=1;i<5;i++)if(n[i]>n[best])best=i;return best}
const cubesOf=col=>allCells().filter(([a,b])=>isCube(G.grid[a][b])&&G.grid[a][b].c===col);

function newRes(){return{clear:new Set(),hits:new Map(),q:[],done:new Set()}}
function hitArea(res,cells){const local=new Set();
 for(const [r,c] of cells){if(!inB(r,c))continue;const k=K(r,c);if(local.has(k))continue;local.add(k);const t=G.grid[r][c];if(!t)continue;
  if(isObs(t))res.hits.set(k,(res.hits.get(k)||0)+1);
  else if(isSp(t)){if(!res.done.has(k)){res.done.add(k);res.q.push([r,c])}res.clear.add(k)}
  else res.clear.add(k)}}
function areaSingle(t,r,c){
 if(t.t==='rh'){fxLine(r,c,'h');snd('rocket');return rowCells(r)}
 if(t.t==='rv'){fxLine(r,c,'v');snd('rocket');return colCells(c)}
 if(t.t==='bomb'){fxBoom(r,c,2.6);snd('boom');buzz(40);return circle(r,c,5)}
 if(t.t==='tnt'){fxBoom(r,c,3.8);snd('boom');buzz(60);return circle(r,c,10)}
 if(t.t==='disco'){const col=(t.c!==undefined)?t.c:mostColor();snd('disco');const cs=cubesOf(col);cs.forEach(([a,b])=>fxBoom(a,b,.7));return cs.concat([[r,c]])}
 return[]}
function runQueue(res){let guard=0;while(res.q.length&&guard++<400){const [r,c]=res.q.shift();const t=G.grid[r][c];if(!t)continue;res.clear.add(K(r,c));hitArea(res,areaSingle(t,r,c))}}

function goalDec(k,n){const g=G.goals.find(x=>x.k===k);if(!g||g.n<=0||n<=0)return;g.n=Math.max(0,g.n-n);drawGoals(k)}
async function applyRes(res){
 for(const [k,n] of res.hits){const r=Math.floor(k/COLS),c=k%COLS;const t=G.grid[r][c];if(!isObs(t)||res.clear.has(k))continue;
  const dmg=Math.min(n,t.hp);if(t.t==='hive'){goalDec('bee',dmg);beeFx(r,c,dmg)}
  t.hp-=n;if(t.hp<=0){if(t.t!=='hive')goalDec(t.t,1);res.clear.add(k)}}
 let nCubes=0;
 for(const k of res.clear){const r=Math.floor(k/COLS),c=k%COLS;const t=G.grid[r][c];if(!t)continue;if(isCube(t)){goalDec('c'+t.c,1);nCubes++}popEl(t,r,c,res.clear.size<30);G.grid[r][c]=null}
 if(res.hits.size)snd('hit');
 if(res.clear.size)snd('pop');
 render();
 await sleep(230);
}
function gravity(){
 for(let c=0;c<COLS;c++){const cells=[];for(let r=ROWS-1;r>=0;r--)if(G.mask[r][c])cells.push(r);
  const tiles=[];for(const r of cells)if(G.grid[r][c])tiles.push(G.grid[r][c]);
  const miss=cells.length-tiles.length;
  for(let i=0;i<cells.length;i++){const r=cells[i];if(i<tiles.length)G.grid[r][c]=tiles[i];else{const t=mk('c',{c:Math.floor(Math.random()*G.nC)});t._from=r-miss-1;G.grid[r][c]=t}}}
}
function hasMove(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r][c];if(!t)continue;if(isSp(t))return true;if(isCube(t))for(const [dr,dc] of [[1,0],[0,1]]){const r2=r+dr,c2=c+dc;if(inB(r2,c2)&&sameCube(G.grid[r2][c2],t))return true}}return false}
async function shuffle(msg){
 const cs=allCells().filter(([a,b])=>isCube(G.grid[a][b]));if(cs.length<2)return;
 let tries=0;do{for(const [a,b] of cs)G.grid[a][b].c=Math.floor(Math.random()*G.nC);tries++}while(!hasMove()&&tries<60);
 if(!hasMove()){for(const [a,b] of cs){for(const [dr,dc] of N4){const t2=inB(a+dr,b+dc)&&G.grid[a+dr][b+dc];if(isCube(t2)){t2.c=G.grid[a][b].c;break}}if(hasMove())break}}
 banner(msg||'Mélange !');render();await sleep(500);
}
async function settle(){gravity();render();await sleep(300);if(!hasMove())await shuffle();hints()}

/* ====================== AFFICHAGE ====================== */
function tileHTML(t){
 switch(t.t){
  case 'c':return`<div class="cube" style="--a:${CCOL[t.c][0]};--b:${CCOL[t.c][1]};--d:${CCOL[t.c][2]}">${SYM[t.c]}</div><div class="hint"></div>`;
  case 'rh':return`<div class="sp rocket h">${ROCKET}</div>`;
  case 'rv':return`<div class="sp rocket v">${ROCKET}</div>`;
  case 'bomb':return`<div class="sp">${BOMB}</div>`;
  case 'tnt':return`<div class="tnt"><span>TNT</span></div>`;
  case 'disco':return`<div class="disco"></div>`;
  case 'stone':return`<div class="stone"></div>`;
  case 'crate':return`<div class="crate hp${t.hp}"></div>`;
  case 'safe':return`<div class="safe hp${t.hp}"><i></i><b>${'•'.repeat(Math.max(0,t.hp))}</b></div>`;
  case 'hive':return`<div class="hive hp${t.hp}"><i></i></div>`;
 }return''}
const sig=t=>t.t+'|'+(t.c??'')+'|'+(t.hp??'');
function render(){
 const tl=$('tiles');const seen=new Set();
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r][c];if(!t)continue;seen.add(t.id);
  let el=els.get(t.id);const x=c*CELL,y=r*CELL;
  if(!el){el=document.createElement('div');el.className='tile';el.innerHTML=tileHTML(t);el._sig=sig(t);tl.appendChild(el);els.set(t.id,el);
   const sr=(t._from!==undefined)?t._from:r;delete t._from;
   el.style.transition='none';el.style.transform=`translate(${x}px,${sr*CELL}px)`;void el.offsetWidth;el.style.transition='';
   if(sr===r&&t.t!=='c')el.classList.add('born')}
  else if(el._sig!==sig(t)){el.innerHTML=tileHTML(t);el._sig=sig(t)}
  el.style.transform=`translate(${x}px,${y}px)`}
 for(const [id,el] of els)if(!seen.has(id)){el.remove();els.delete(id)}
}
function popEl(t,r,c,parts){const el=els.get(t.id);if(!el)return;els.delete(t.id);el.classList.add('pop');setTimeout(()=>el.remove(),260);
 if(parts&&isCube(t)){for(let i=0;i<3;i++){const p=document.createElement('div');p.className='part';p.style.background=CCOL[t.c][1];p.style.left=(c*CELL+CELL/2-6)+'px';p.style.top=(r*CELL+CELL/2-6)+'px';const a=Math.random()*6.28,d=CELL*(.6+Math.random()*.8);p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d+'px');$('fx').appendChild(p);setTimeout(()=>p.remove(),520)}}}
function fxLine(r,c,dir){const d=document.createElement('div');d.className='fx-line '+dir;
 if(dir==='h'){d.style.left='0';d.style.width=COLS*CELL+'px';d.style.top=(r*CELL+CELL*.2)+'px';d.style.height=CELL*.6+'px';d.style.transformOrigin=(c*CELL+CELL/2)+'px 50%'}
 else{d.style.top='0';d.style.height=ROWS*CELL+'px';d.style.left=(c*CELL+CELL*.2)+'px';d.style.width=CELL*.6+'px';d.style.transformOrigin='50% '+(r*CELL+CELL/2)+'px'}
 $('fx').appendChild(d);setTimeout(()=>d.remove(),460)}
function fxBoom(r,c,rad){const d=document.createElement('div');d.className='fx-boom';const s=rad*2*CELL;d.style.width=d.style.height=s+'px';d.style.left=(c*CELL+CELL/2-s/2)+'px';d.style.top=(r*CELL+CELL/2-s/2)+'px';$('fx').appendChild(d);setTimeout(()=>d.remove(),470)}
function beeFx(r,c,n){const g=document.querySelector('.goal[data-k="bee"]');if(!g)return;const br=$('board').getBoundingClientRect(),gr=g.getBoundingClientRect();
 for(let i=0;i<Math.min(n,3);i++){const b=document.createElement('div');b.className='bee';b.textContent='🐝';b.style.left=(br.left+c*CELL+CELL/4)+'px';b.style.top=(br.top+r*CELL)+'px';document.body.appendChild(b);
  setTimeout(()=>{b.style.left=(gr.left+6)+'px';b.style.top=(gr.top+4)+'px';b.style.opacity='.3'},30+i*90);setTimeout(()=>b.remove(),850+i*90)}}
let banT;function banner(t){const b=$('banner');b.textContent=t;b.classList.add('show');clearTimeout(banT);banT=setTimeout(()=>b.classList.remove('show'),1000)}
function hints(){const seen=new Set();
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=G.grid[r][c];if(!isCube(t)||seen.has(K(r,c)))continue;const g=flood(r,c,sameCube);g.forEach(([a,b])=>seen.add(K(a,b)));
  const n=g.length;const h=n>=9?'d':n>=7?'b':n>=5?'r':'';
  for(const [a,b] of g){const el=els.get(G.grid[a][b].id);if(!el)continue;if(el._h===h)continue;el._h=h;const hd=el.querySelector('.hint');if(!hd)continue;
   hd.innerHTML=h==='r'?ROCKET:h==='b'?BOMB:h==='d'?'<div class="disco" style="position:absolute;inset:8%"></div>':''}}}
function drawCells(){const ce=$('cells');ce.innerHTML='';for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.mask[r][c]){const d=document.createElement('div');d.className='cell'+((r+c)%2?' alt':'');d.style.left=(c*CELL+1)+'px';d.style.top=(r*CELL+1)+'px';d.style.width=d.style.height=(CELL-2)+'px';ce.appendChild(d)}}
function layout(){if(!G)return;const w=$('boardWrap');const W=w.clientWidth-4,H=w.clientHeight-8;CELL=Math.max(20,Math.floor(Math.min(W/COLS,H/ROWS)));
 const b=$('board');b.style.width=COLS*CELL+'px';b.style.height=ROWS*CELL+'px';b.style.setProperty('--cell',CELL+'px');drawCells();
 for(const el of els.values())el.style.transition='none';render();void $('tiles').offsetWidth;for(const el of els.values())el.style.transition=''}
function goalIcon(k){if(k==='bee')return'<span class="emo">🐝</span>';
 if(k[0]==='c'){const c=+k.slice(1);return`<div class="cube" style="--cell:32px;--a:${CCOL[c][0]};--b:${CCOL[c][1]};--d:${CCOL[c][2]}">${SYM[c]}</div>`}
 if(k==='safe')return'<div class="safe hp3" style="--cell:32px"><i></i></div>';if(k==='hive')return'<div class="hive"><i></i></div>';return`<div class="${k} hp2" style="--cell:32px"></div>`}
function drawGoals(bumpK){const g=$('goals');
 if(!bumpK||g.children.length!==G.goals.length){g.innerHTML=G.goals.map(x=>`<div class="goal" data-k="${x.k}"><div class="gi">${goalIcon(x.k)}</div><span>${x.n>0?x.n:'<span class="ok">✔</span>'}</span></div>`).join('');g.style.gridTemplateColumns=G.goals.length===1?'1fr':'1fr 1fr';return}
 const x=G.goals.find(q=>q.k===bumpK);const el=g.querySelector(`.goal[data-k="${bumpK}"]`);if(!x||!el)return;el.querySelector('span:last-child').outerHTML=`<span>${x.n>0?x.n:'<span class="ok">✔</span>'}</span>`;el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
function updMoves(){$('moves').textContent=Math.max(0,G.moves);$('movesBox').classList.toggle('low',G.moves<=5&&!G.over)}
function drawBoosters(){$('bbar').innerHTML=`<button class="bst gear" id="bPause" aria-label="Pause">⚙️</button>`+BOOSTERS.map(b=>{const n=S.boost[b.k]||0;return`<button class="bst${G&&G.booster===b.k?' on':''}" data-b="${b.k}">${b.ic}<span class="n${n?'':' plus'}">${n||'+'}</span></button>`}).join('');
 $('bPause').onclick=pauseMenu;document.querySelectorAll('.bst[data-b]').forEach(e=>e.onclick=()=>boosterTap(e.dataset.b))}
function tip(t){const e=$('tip');if(t){e.textContent=t;e.classList.remove('hidden')}else e.classList.add('hidden')}

/* ====================== ACTIONS ====================== */
function saveCur(){if(!G||G.over)return;const grid=G.grid.map(row=>row.map(t=>t?{id:t.id,t:t.t,c:t.c,hp:t.hp}:null));S.cur={level:G.level,nC:G.nC,mask:G.mask,grid,moves:G.moves,startMoves:G.startMoves,goals:G.goals};save()}
function boardTap(ev){if(!G||G.busy||G.over)return;const br=$('board').getBoundingClientRect();const c=Math.floor((ev.clientX-br.left)/CELL),r=Math.floor((ev.clientY-br.top)/CELL);if(!inB(r,c))return;const t=G.grid[r][c];if(!t)return;
 if(G.booster)return useBooster(r,c);
 if(isCube(t))return tapCube(r,c);
 if(isSp(t))return tapSpecial(r,c);
 nudge(t);snd('bad')}
function nudge(t){const el=els.get(t.id);if(!el)return;el.classList.remove('nudge');void el.offsetWidth;el.classList.add('nudge')}
async function tapCube(r,c){
 const grp=flood(r,c,sameCube);if(grp.length<2){nudge(G.grid[r][c]);snd('bad');return}
 G.busy=true;G.moves--;updMoves();buzz(15);
 const res=newRes();const n=grp.length;const col=G.grid[r][c].c;let sp=null;
 if(n>=9)sp=mk('disco',{c:col});else if(n>=7)sp=mk('bomb');else if(n>=5)sp=mk(Math.random()<.5?'rh':'rv');
 const adj=new Set();
 for(const [a,b] of grp){res.clear.add(K(a,b));for(const [dr,dc] of N4){const a2=a+dr,b2=b+dc;if(inB(a2,b2)&&isObs(G.grid[a2][b2]))adj.add(K(a2,b2))}}
 for(const k of adj)res.hits.set(k,1);
 if(sp){for(const [a,b] of grp){const el=els.get(G.grid[a][b].id);if(el){el.classList.add('fast');el.style.transform=`translate(${c*CELL}px,${r*CELL}px)`}}await sleep(160)}
 await applyRes(res);
 if(sp){G.grid[r][c]=sp;render()}
 await settle();await afterMove()}
async function tapSpecial(r,c){
 G.busy=true;G.moves--;updMoves();buzz(25);
 const grp=flood(r,c,t=>isSp(t));const res=newRes();
 if(grp.length<2){res.done.add(K(r,c));res.q.push([r,c]);runQueue(res);await applyRes(res)}
 else{
  const ts=grp.map(([a,b])=>G.grid[a][b]);
  const nD=ts.filter(t=>t.t==='disco').length,nB=ts.filter(t=>t.t==='bomb'||t.t==='tnt').length,nT=ts.filter(t=>t.t==='tnt').length,nR=ts.filter(t=>t.t==='rh'||t.t==='rv').length;
  const disco=ts.find(t=>t.t==='disco');
  for(const [a,b] of grp){const k=K(a,b);res.done.add(k);res.clear.add(k);const el=els.get(G.grid[a][b].id);if(el){el.classList.add('fast');el.style.transform=`translate(${c*CELL}px,${r*CELL}px)`}}
  await sleep(180);
  if(nD>=2){fxBoom(r,c,9);snd('boom');snd('disco');buzz(120);hitArea(res,allCells())}
  else if(nD===1&&(nB||nR)){
   const col=(disco.c!==undefined)?disco.c:mostColor();const targets=cubesOf(col);snd('disco');
   for(const [a,b] of targets){const t=G.grid[a][b];t.t=nB?'bomb':(Math.random()<.5?'rh':'rv');delete t.c}
   for(const [a,b] of grp)G.grid[a][b]=null;for(const [a,b] of grp)res.clear.delete(K(a,b));
   render();await sleep(450);
   for(const [a,b] of targets){const k=K(a,b);res.done.add(k);res.q.push([a,b])}}
  else if(nB>=2){fxBoom(r,c,nT>=2?6:5);snd('boom');buzz(90);hitArea(res,circle(r,c,nT>=1?26:17))}
  else if(nB>=1&&nR>=1){snd('rocket');snd('boom');const cells=[];for(let d=-1;d<=1;d++){fxLine(r+d,c,'h');fxLine(r,c+d,'v');if(r+d>=0&&r+d<ROWS)cells.push(...rowCells(r+d));if(c+d>=0&&c+d<COLS)cells.push(...colCells(c+d))}hitArea(res,cells)}
  else{snd('rocket');fxLine(r,c,'h');fxLine(r,c,'v');hitArea(res,rowCells(r).concat(colCells(c)))}
  runQueue(res);await applyRes(res)}
 await settle();await afterMove()}
async function afterMove(){
 if(G.goals.every(g=>g.n<=0)){await win();return}
 if(G.moves<=0){saveCur();G.busy=false;lose();return}
 G.busy=false;saveCur()}
function boosterTap(k){if(!G||G.busy||G.over)return;
 if(!(S.boost[k]>0)){buyAsk(k);return}
 if(k==='shuffle'){G.busy=true;S.boost.shuffle--;save();drawBoosters();shuffle('Mélange !').then(()=>{hints();G.busy=false;saveCur()});return}
 G.booster=G.booster===k?null:k;drawBoosters();tip(G.booster?'Touche une case':'')}
async function useBooster(r,c){const k=G.booster;G.booster=null;tip('');G.busy=true;S.boost[k]--;save();drawBoosters();buzz(30);
 const res=newRes();
 if(k==='hammer'){const t=G.grid[r][c];snd('hit');fxBoom(r,c,.8);if(isObs(t))res.hits.set(K(r,c),99);else if(isSp(t)){res.done.add(K(r,c));res.q.push([r,c])}else res.clear.add(K(r,c))}
 else if(k==='row'){fxLine(r,c,'h');snd('rocket');hitArea(res,rowCells(r))}
 else if(k==='col'){fxLine(r,c,'v');snd('rocket');hitArea(res,colCells(c))}
 runQueue(res);await applyRes(res);await settle();await afterMove()}
function buyAsk(k){const b=BOOSTERS.find(x=>x.k===k);
 modal(`<h2>${b.name}</h2><p>Tu n'en as plus.<br>En acheter 1 pour ${PRICE} pièces ?<br><small>Tu as ${S.coins} pièces.</small></p>
 <button class="btn" id="mBuy" ${S.coins<PRICE?'disabled':''}>Acheter (${PRICE} 🪙)</button><button class="btn grey" id="mNo">Annuler</button>`);
 $('mBuy').onclick=()=>{if(S.coins<PRICE)return;S.coins-=PRICE;S.boost[k]=(S.boost[k]||0)+1;save();snd('coin');closeModal();drawBoosters();toast('+1 '+b.name)};$('mNo').onclick=closeModal}

async function win(){
 G.over=true;G.busy=true;snd('win');banner('Bravo !');buzz([60,40,60]);await sleep(1000);
 const left=G.moves;const bonus=Math.min(left,15);
 for(let i=0;i<bonus;i++){const cs=allCells().filter(([a,b])=>isCube(G.grid[a][b]));if(!cs.length)break;const [a,b]=cs[Math.floor(Math.random()*cs.length)];const t=G.grid[a][b];t.t=Math.random()<.5?'rh':'rv';delete t.c;G.moves--;updMoves();render();const el=els.get(t.id);if(el){el.classList.remove('born');void el.offsetWidth;el.classList.add('born')}snd('coin');await sleep(110)}
 let guard=0;
 while(guard++<40){let found=null;for(let r=0;r<ROWS&&!found;r++)for(let c=0;c<COLS;c++)if(isSp(G.grid[r][c])){found=[r,c];break}if(!found)break;
  const res=newRes();res.done.add(K(...found));res.q.push(found);runQueue(res);await applyRes(res);gravity();render();await sleep(250)}
 const coins=5+left;const ratio=left/G.startMoves;const stars=ratio>=.3?3:ratio>=.12?2:1;
 const L=G.level;S.stars[L]=Math.max(S.stars[L]||0,stars);S.level=Math.max(S.level,L+1);S.coins+=coins;S.cur=null;S.wins=(S.wins||0)+1;save();
 modal(`<h2>Niveau ${L} réussi !</h2><div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">⭐</span>`).join('')}</div>
 <p>+${coins} pièces <span class="coin" style="vertical-align:middle"></span></p>
 <button class="btn" id="mNext">Niveau suivant</button><button class="btn blue" id="mMap">Carte</button>`);
 $('mNext').onclick=()=>{closeModal();startLevel(S.level)};$('mMap').onclick=()=>{closeModal();showMap()}}
function lose(){snd('lose');const rest=G.goals.filter(g=>g.n>0).map(g=>`<span class="goal" style="display:inline-flex;margin:0 6px"><span class="gi">${goalIcon(g.k)}</span>${g.n}</span>`).join('');
 modal(`<h2>Plus de coups !</h2><p>Il reste :</p><div style="font-size:22px;font-weight:900;margin-bottom:8px">${rest}</div>
 <button class="btn" id="m5" ${S.coins<10?'disabled':''}>+5 coups (10 🪙)</button>
 <button class="btn blue" id="mRe">Rejouer (vies illimitées)</button><button class="btn grey" id="mMap">Carte</button>`);
 $('m5').onclick=()=>{if(S.coins<10)return;S.coins-=10;G.moves+=5;save();updMoves();saveCur();closeModal();snd('coin')};
 $('mRe').onclick=()=>{closeModal();S.cur=null;save();startLevel(G.level)};
 $('mMap').onclick=()=>{closeModal();S.cur=null;save();showMap()}}
function pauseMenu(){if(!G)return;
 modal(`<h2>Pause</h2><button class="btn" id="mGo">Reprendre</button><button class="btn blue" id="mRe">Recommencer le niveau</button><button class="btn grey" id="mMap">Retour à la carte</button><p style="font-size:14px;margin-top:14px">Ta partie est sauvegardée automatiquement.</p>`);
 $('mGo').onclick=closeModal;
 $('mRe').onclick=()=>confirmBox('Recommencer ce niveau depuis le début ?','Recommencer',()=>{S.cur=null;save();startLevel(G.level)});
 $('mMap').onclick=()=>{closeModal();showMap()}}

/* ====================== ÉCRANS ====================== */
function startLevel(L){
 els.forEach(e=>e.remove());els.clear();$('fx').innerHTML='';
 if(S.cur&&S.cur.level===L){const c=S.cur;let mx=0;const grid=c.grid.map(row=>row.map(t=>{if(!t)return null;const o={id:t.id,t:t.t};if(t.c!==undefined&&t.c!==null)o.c=t.c;if(t.hp!==undefined&&t.hp!==null)o.hp=t.hp;mx=Math.max(mx,t.id);return o}));nid=mx+1;
  G={level:L,nC:c.nC,mask:c.mask,grid,moves:c.moves,startMoves:c.startMoves,goals:c.goals}}
 else{G=genLevel(L);S.cur=null}
 G.busy=false;G.over=false;G.booster=null;
 $('map').classList.add('hidden');$('game').classList.remove('hidden');
 $('lvlNum').textContent=L;drawGoals();updMoves();drawBoosters();tip('');
 if(history.state!=='game')history.pushState('game','');
 requestAnimationFrame(()=>{layout();if(!hasMove())shuffle().then(hints);else hints();saveCur();banner(S.cur&&S.cur.moves<G.startMoves?'C\'est reparti !':'TNT activée !')})}
function showMap(){G=null;$('game').classList.add('hidden');$('map').classList.remove('hidden');renderMap()}
function renderMap(){
 $('coinsMap').textContent=S.coins;$('btnPlay').textContent='Jouer — Niveau '+S.level;
 $('bonusDot').classList.toggle('hidden',S.bonusDay===today());
 const L=S.level,from=Math.max(1,L-4),to=L+7,n=to-from+1,step=118,H=n*step+140;
 const p=$('path');p.style.height=H+'px';const W=p.clientWidth||360;
 const pts=[];for(let i=0;i<n;i++){const lv=from+i;const y=H-90-i*step;const x=W*(.56+.26*Math.sin(i*1.05));pts.push([x,y,lv])}
 let h=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="#ffffff55" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 22"/></svg>`;
 for(const [x,y,lv] of pts){const cls=lv<L?'done':lv===L?'cur':'lock';const st=lv<L?'⭐'.repeat(S.stars[lv]||3):'';
  h+=`<button class="node ${cls}" style="left:${x}px;top:${y}px" data-lv="${lv}">${lv===L?'▶':''}${st?`<span class="st">${st}</span>`:''}<span class="lbl">${lv}</span></button>`}
 p.innerHTML=h;
 p.querySelectorAll('.node.cur').forEach(b=>b.onclick=()=>startLevel(S.level));
 const cur=pts.find(q=>q[2]===L);requestAnimationFrame(()=>{$('mapScroll').scrollTop=cur[1]-$('mapScroll').clientHeight/2})}

/* ====================== FENÊTRES ====================== */
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function confirmBox(txt,okLabel,ok){modal(`<h2>Confirmer</h2><p>${txt}</p><button class="btn red" id="cOk">${okLabel}</button><button class="btn grey" id="cNo">Annuler</button>`);$('cOk').onclick=()=>{closeModal();ok()};$('cNo').onclick=closeModal}
function bonusMenu(){
 if(S.bonusDay===today()){modal(`<h2>Bonus du jour</h2><p>Tu as déjà pioché aujourd'hui.<br>Reviens demain pour une autre récompense !</p><button class="btn" id="mOk">OK</button>`);$('mOk').onclick=closeModal;return}
 const pool=[{b:'hammer',n:1},{b:'row',n:1},{b:'col',n:1},{b:'shuffle',n:1},{coins:10},{coins:25},{b:'hammer',n:2},{coins:5},{b:'row',n:2}];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const lab=x=>x.coins?`🪙<small>+${x.coins}</small>`:`<div style="width:60%;height:40%">${BOOSTERS.find(b=>b.k===x.b).ic}</div><small>+${x.n}</small>`;
 modal(`<h2>Bonus du jour !</h2><div class="cards">${pool.map((x,i)=>`<button class="card" data-i="${i}">?</button>`).join('')}</div><p id="bTxt">Pioche une carte pour obtenir ta récompense !</p><button class="btn hidden" id="bOk">Récupérer</button>`);
 let picked=false;
 document.querySelectorAll('.card').forEach(cd=>cd.onclick=()=>{if(picked)return;picked=true;const i=+cd.dataset.i,x=pool[i];
  cd.classList.add('rev','mine');cd.innerHTML=lab(x);snd('coin');
  if(x.coins)S.coins+=x.coins;else S.boost[x.b]=(S.boost[x.b]||0)+x.n;S.bonusDay=today();save();
  setTimeout(()=>{document.querySelectorAll('.card').forEach(o=>{if(o===cd)return;o.classList.add('rev','dim');o.innerHTML=lab(pool[+o.dataset.i])});$('bTxt').textContent='Reviens demain pour une autre récompense !';$('bOk').classList.remove('hidden')},600)});
 $('bOk').onclick=()=>{closeModal();renderMap()}}
function shopMenu(){
 const draw=()=>{modal(`<h2>Boutique</h2><p style="margin:0 0 6px">Tu as <b>${S.coins}</b> <span class="coin" style="vertical-align:middle;width:20px;height:20px"></span></p>`+BOOSTERS.map(b=>`<div class="shopRow"><div class="ico">${b.ic}</div><div class="txt">${b.name} <small>${b.desc} — tu en as ${S.boost[b.k]||0}</small></div><button data-k="${b.k}" ${S.coins<PRICE?'disabled style="opacity:.45"':''}>${PRICE} 🪙</button></div>`).join('')+`<button class="btn blue" id="sOk">Fermer</button>`);
  document.querySelectorAll('.shopRow button').forEach(b=>b.onclick=()=>{if(S.coins<PRICE)return;S.coins-=PRICE;S.boost[b.dataset.k]=(S.boost[b.dataset.k]||0)+1;save();snd('coin');draw()});
  $('sOk').onclick=()=>{closeModal();renderMap()}};draw()}
function settingsMenu(){
 const draw=()=>{modal(`<h2>Réglages</h2>
 <div class="row">Son<button class="sw ${S.sound?'on':''}" id="tS"></button></div>
 <div class="row">Vibrations<button class="sw ${S.vibe?'on':''}" id="tV"></button></div>
 <div class="row" style="flex-direction:column;align-items:stretch">Aller au niveau :<input type="number" id="lvIn" value="${S.level}" inputmode="numeric"><button class="btn blue" id="lvGo" style="margin-top:8px">Aller à ce niveau</button></div>
 <p style="font-size:15px;margin:14px 0 0">Ta partie se sauvegarde toute seule sur ton téléphone. Pour ne jamais la perdre, garde aussi une copie :</p>
 <button class="btn" id="bDl">💾 Télécharger ma sauvegarde</button>
 <button class="btn blue" id="bSh">📤 Envoyer ma sauvegarde (Drive…)</button>
 <button class="btn grey" id="bRe">📥 Restaurer une sauvegarde</button>
 <button class="btn blue" id="bClose">Fermer</button>`);
 $('tS').onclick=()=>{S.sound=!S.sound;save();draw()};$('tV').onclick=()=>{S.vibe=!S.vibe;save();draw()};
 $('lvGo').onclick=()=>{const v=parseInt($('lvIn').value,10);if(!(v>=1&&v<1e7))return toast('Numéro invalide');confirmBox(`Aller au niveau ${v} ?<br><small>Le niveau en cours sera abandonné.</small>`,'Oui, y aller',()=>{S.level=v;S.cur=null;save();renderMap();toast('Niveau '+v)})};
 $('bDl').onclick=()=>{const blob=backupBlob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Sauvegarde téléchargée')};
 $('bSh').onclick=async()=>{try{const f=new File([backupBlob()],backupName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Cube Boum'})}else toast('Utilise « Télécharger »')}catch(e){}};
 $('bRe').onclick=()=>$('fileIn').click();
 $('bClose').onclick=()=>{closeModal();renderMap()}};draw()}
const backupName=()=>'cube-boum-sauvegarde-'+today()+'.json';
const backupBlob=()=>new Blob([JSON.stringify(Object.assign({app:'cubeboum'},S))],{type:'application/json'});
$('fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.v||!d.level)throw 0;
 confirmBox(`Restaurer cette sauvegarde ?<br><small>Niveau ${d.level}, ${d.coins} pièces. Ta partie actuelle sera remplacée.</small>`,'Restaurer',()=>{delete d.app;S=Object.assign(defSave(),d);S.boost=Object.assign(defSave().boost,d.boost);save();renderMap();toast('Sauvegarde restaurée')})}catch(err){toast('Fichier non reconnu')}};rd.readAsText(f)};

/* ====================== DÉMARRAGE ====================== */
$('board').addEventListener('pointerdown',boardTap);
$('btnPlay').onclick=()=>startLevel(S.level);
$('btnBonus').onclick=bonusMenu;$('btnShop').onclick=shopMenu;$('btnSettings').onclick=settingsMenu;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal')&&!G?.over)closeModal()});
window.addEventListener('resize',()=>{if(G)layout();else renderMap()});
window.addEventListener('popstate',()=>{if(!$('modal').classList.contains('hidden')&&!(G&&G.over)){closeModal();if(G)history.pushState('game','');return}if(G&&!G.busy){showMap()}else if(G){history.pushState('game','')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
renderMap();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
