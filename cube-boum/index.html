<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c5f78">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cube Boum</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#173b4d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;touch-action:manipulation}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
/* ---------- barre du haut ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:linear-gradient(#2a7f9e,#1c5f78);box-shadow:0 4px 0 #0f3e50;z-index:5}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fdeccb;color:#5a3a12;font-weight:900;border-radius:16px;padding:6px 10px;font-size:20px;box-shadow:inset 0 -4px 0 #e1c48f;min-height:44px}
.pill .ic{font-size:24px;line-height:1}
.coin{display:inline-block;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffcf2e 45%,#d99000);box-shadow:inset 0 -2px 0 #b77400,0 1px 0 #00000033;position:relative}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #fff3;}
.round{width:48px;height:48px;border-radius:50%;border:none;background:#3c9bbd;box-shadow:inset 0 -4px 0 #236a85;font-size:24px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- carte ---------- */
#mapScroll{flex:1;overflow-y:auto;position:relative;background:
 radial-gradient(circle at 20% 20%,#ffffff14 0 40px,transparent 41px) 0 0/160px 160px,
 radial-gradient(circle at 70% 60%,#ffffff10 0 26px,transparent 27px) 0 0/130px 130px,
 linear-gradient(#5b3fa8,#2f7fa8 50%,#2e9e8a)}
#path{position:relative;width:100%}
#path svg{position:absolute;left:0;top:0;width:100%;height:100%}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900;font-size:15px;color:#fff;text-shadow:0 2px 0 #0005;border:none}
.node.done{background:radial-gradient(circle at 40% 30%,#9ff0c0,#2fae6a);box-shadow:inset 0 -5px 0 #1d7a48,0 4px 0 #0004}
.node.lock{background:radial-gradient(circle at 40% 30%,#d6dde6,#8a97a8);box-shadow:inset 0 -5px 0 #5f6b7a,0 4px 0 #0004}
.node.cur{width:92px;height:92px;margin:-46px 0 0 -46px;font-size:18px;background:radial-gradient(circle at 40% 30%,#ffd1a0,#ff7a3c);box-shadow:inset 0 -6px 0 #c74b14,0 0 0 6px #fff8,0 6px 0 #0004;animation:pulse 1.4s infinite}
.node .st{font-size:12px;letter-spacing:-1px;color:#ffe14d}
.node .lbl{position:absolute;bottom:-26px;white-space:nowrap;font-size:17px;background:#0006;padding:1px 8px;border-radius:10px}
@keyframes pulse{50%{transform:scale(1.07)}}
.side{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 84px);display:flex;flex-direction:column;gap:14px;z-index:4}
.sideBtn{width:70px;height:70px;border-radius:50%;border:none;background:radial-gradient(circle at 40% 30%,#6fd0ef,#2a86ad);box-shadow:inset 0 -5px 0 #1c5f78,0 4px 0 #0004;font-size:32px;position:relative;color:#fff}
.sideBtn small{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;background:#1c5f78;padding:2px 7px;border-radius:8px;white-space:nowrap}
.dot{position:absolute;top:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:#ff3b3b;border:3px solid #fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center}
.playBar{padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(#2a7f9e,#1c5f78);box-shadow:0 -4px 0 #0f3e50}
.big{width:100%;border:none;border-radius:20px;padding:16px;font-size:24px;font-weight:900;color:#fff;background:linear-gradient(#8ee35a,#4cb52a);box-shadow:inset 0 -6px 0 #2f8a17,0 4px 0 #0004;text-shadow:0 2px 0 #0004}
.big:active,.sideBtn:active,.round:active,.bst:active{transform:translateY(2px)}
/* ---------- jeu ---------- */
#game{background:
 radial-gradient(ellipse 60% 40% at 10% 90%,#ffb35a33,transparent 70%),
 radial-gradient(ellipse 50% 35% at 95% 30%,#ff7ac833,transparent 70%),
 radial-gradient(circle at 15% 25%,#ffffff10 0 50px,transparent 51px) 0 0/180px 180px,
 linear-gradient(#7a4aa8,#9a5a8a 45%,#c0734f)}
.hud{display:flex;align-items:stretch;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 10px;z-index:3}
.hudBox{position:relative;background:#2c6f80;border-radius:18px;padding:16px 6px 6px;box-shadow:0 4px 0 #173f4a}
.hudBox .tag{position:absolute;top:-2px;left:50%;transform:translate(-50%,-40%);background:#2c6f80;color:#ffe27a;font-weight:900;font-size:13px;padding:2px 12px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 0 #173f4a}
.goalsBox{flex:1.35}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#fdeccb;border-radius:12px;padding:5px;box-shadow:inset 0 -3px 0 #e1c48f;min-height:78px;height:100%}
.goal{display:flex;align-items:center;justify-content:center;gap:3px;color:#3b2a10;font-weight:900;font-size:21px;position:relative}
.goal.bump{animation:bump .25s}
.goal .ok{color:#2fae3a;font-size:24px}
@keyframes bump{50%{transform:scale(1.3)}}
.gi{width:32px;height:32px;position:relative;flex:none;--cell:32px}
.gi>div,.gi>svg{position:absolute;inset:0;margin:0;width:100%;height:100%}
.gi .emo{font-size:27px;line-height:32px}
.mascot{flex:.8;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.mascot .face{width:78px;height:78px;border-radius:50%;background:#2c6f80;box-shadow:0 4px 0 #173f4a;display:flex;align-items:center;justify-content:center}
.mascot .face svg{width:68px;height:68px}
.mascot.happy .face svg{animation:hop .5s 2}
@keyframes hop{50%{transform:translateY(-8px) rotate(-6deg)}}
.lvlTag{margin-top:4px;font-weight:900;font-size:13px;background:#0005;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tntOn{margin-top:3px;font-size:10px;font-weight:900;background:#e33;padding:1px 7px;border-radius:8px;box-shadow:inset 0 -2px 0 #a11}
.movesBox{flex:1;display:flex;flex-direction:column;align-items:center}
.movesIn{flex:1;width:100%;background:#fdeccb;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#3b2a10;box-shadow:inset 0 -3px 0 #e1c48f}
.movesIn b{font-size:44px;line-height:1;font-weight:900}
.movesBox.low b{color:#e33;animation:bump .6s infinite}
.bar{position:relative;width:100%;height:12px;margin-top:6px;border-radius:6px;background:#173f4a;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#ffe27a,#ffb31a);transition:width .4s}
.bar s{position:absolute;top:0;bottom:0;width:3px;background:#c98a10}
#boardWrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#board{position:relative}
#cells{filter:drop-shadow(0 6px 0 #00000055) drop-shadow(0 0 10px #0006)}
#board.quake{animation:quake .35s}
@keyframes quake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#cells,#tiles,#fx{position:absolute;inset:0}
#tiles{overflow:hidden}
#fx{pointer-events:none;overflow:visible}
.cell{position:absolute;background:#2a1d4ad9;border:0 solid #f3c34e}
.cell.alt{background:#32245ad9}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .27s cubic-bezier(.55,0,.85,.55);will-change:transform}
.tile.fast{transition:transform .3s cubic-bezier(.5,0,.8,.4)}
.tile.grp>*:first-child{box-shadow:0 0 0 .2em #fff,0 0 .6em #fff8}
.flash{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,#fff8 40%,transparent 70%);animation:boom .4s forwards;pointer-events:none}
.bolt{position:absolute;left:0;top:0;height:4px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,#bff4ff);box-shadow:0 0 8px #9ef,0 0 14px #fff;border-radius:2px;animation:bolt .5s forwards}
@keyframes bolt{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.tile>*{position:absolute;inset:2.5%}
.tile.pop{animation:pop .3s forwards}
.tile.land>*:first-child{animation:land .24s ease-out;transform-origin:50% 100%}
@keyframes land{0%{scale:1.1 .82}55%{scale:.95 1.06}100%{scale:1 1}}
.flyR{position:absolute;left:0;top:0;transition:transform .36s linear;z-index:5;filter:drop-shadow(0 0 8px #ffe36a)}
.flyR svg{width:100%;height:100%}
.star{position:absolute;width:16px;height:16px;background:#fff6a0;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%);animation:part .55s ease-out forwards}
.combo{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:46px;font-weight:900;color:#fff;-webkit-text-stroke:2px #c74b14;text-shadow:0 5px 0 #c74b14,0 0 24px #ffd23a;pointer-events:none;z-index:7;animation:combo .9s forwards}
@keyframes combo{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1) translateY(-30px);opacity:0}}
.tile.born{animation:born .35s}
.tile.nudge>*:first-child{animation:nudge .3s}
.tile.shake>*:first-child{animation:shake .25s}
@keyframes pop{0%{filter:brightness(1)}35%{filter:brightness(1.8);scale:1.12}100%{opacity:0;scale:.25}}
@keyframes born{0%{scale:.2}70%{scale:1.2}100%{scale:1}}
@keyframes nudge{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}
@keyframes shake{25%{transform:rotate(-8deg) scale(.92)}75%{transform:rotate(8deg) scale(.92)}}
.cube{border-radius:13%;background:repeating-linear-gradient(97deg,#ffffff00 0 9%,#ffffff12 9% 11%,#00000008 11% 14%),linear-gradient(170deg,var(--a) 0%,var(--b) 36%,var(--b) 72%,var(--d) 100%);box-shadow:inset 0 -.34em 0 var(--d),inset 0 .2em 0 #ffffff80,inset .16em 0 0 #ffffff33,inset -.16em 0 0 #0000001f,0 3px 3px #0005;font-size:calc(var(--cell)*.18);display:flex;align-items:center;justify-content:center}
.cube::before{content:"";position:absolute;left:10%;right:10%;top:6%;height:18%;border-radius:40% 40% 30% 30%;background:linear-gradient(#ffffff70,#ffffff00)}
.cube svg{width:64%;height:64%;position:relative;filter:drop-shadow(0 -.05em 0 #00000040) drop-shadow(0 .06em 0 #ffffff55)}
.hint{inset:auto 0 0 auto!important;width:46%;height:46%;pointer-events:none}
.hint svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px #0008)}
.sp svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0005)}
.rocket.v svg{transform:rotate(90deg)}
.tnt{border-radius:16%;background:linear-gradient(#ff6a5a,#d8231b 60%,#9e1010);box-shadow:inset 0 -.25em 0 #0004,inset 0 .2em 0 #fff5;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.3)}
.tnt::before{content:"";position:absolute;left:0;right:0;top:34%;height:32%;background:#fff3}
.tnt span{position:relative;font-weight:900;color:#fff;text-shadow:0 2px 0 #6a0000;letter-spacing:.02em}
.disco{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 30%),conic-gradient(#ff4a4a,#ffc21a,#38c94a,#2f86f0,#9b51f5,#ff4a4a);box-shadow:inset 0 -.2em 0 #0003,0 0 8px #fff8;animation:spin 3s linear infinite}
@keyframes spin{to{rotate:360deg}}
.stone{inset:2%!important;border-radius:28% 34% 26% 32%;background:radial-gradient(circle at 30% 28%,#f6f8fb,#c3ccd7 55%,#8a96a5);box-shadow:inset 0 -.25em 0 #0002,0 2px 2px #0003}
.stone::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse 12% 9% at 66% 60%,#8d99a888 90%,transparent),radial-gradient(ellipse 9% 7% at 30% 70%,#8d99a866 90%,transparent)}
.stone.hp2{background:radial-gradient(circle at 30% 28%,#c9d0da,#8995a5 55%,#5b6676)}
.stone.hp2::before{content:"";position:absolute;inset:14%;border-radius:inherit;border:.14em solid #ffffff55}
.crate{inset:2%!important;border-radius:10%;background:repeating-linear-gradient(180deg,#e2a055 0 30%,#a8642a 30% 33.3%);border:.18em solid #7a4518;box-shadow:inset 0 0 0 .12em #f0b56e66,0 2px 2px #0003}
.crate::before{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 44%,#8a501f 44% 56%,transparent 56%)}
.crate.hp3{filter:brightness(.72) saturate(1.2)}
.crate.hp1::after{content:"";position:absolute;inset:15%;background:linear-gradient(120deg,transparent 45%,#3a1d06 46% 50%,transparent 51%),linear-gradient(30deg,transparent 47%,#3a1d06 48% 51%,transparent 52%)}
.crate b{position:absolute;right:4%;bottom:2%;font-size:calc(var(--cell)*.24);color:#fff;text-shadow:0 1px 2px #000}
.safe{inset:2%!important;border-radius:14%;background:linear-gradient(150deg,#eef3f7,#a9b6c2 55%,#6f7d8b);box-shadow:inset 0 -.25em 0 #0003,inset 0 .15em 0 #fff8,0 2px 2px #0003}
.safe i{position:absolute;left:25%;top:22%;width:50%;height:50%;border-radius:50%;background:radial-gradient(circle,#4b6a8a 0 22%,#9fb6cc 24% 52%,#3c5570 54%);box-shadow:0 0 0 .12em #2fb35a}
.safe.hp1 i{box-shadow:0 0 0 .12em #ff4040}
.safe::after{content:"";position:absolute;right:6%;top:40%;width:8%;height:20%;border-radius:2px;background:#5a6a7a}
.gemst{inset:2%!important;border-radius:28% 34% 26% 32%;background:radial-gradient(circle at 30% 28%,#eef2f6,#b3bdc9 55%,#7d8999);box-shadow:inset 0 -.25em 0 #0002,0 2px 2px #0003}
.gemst svg{position:absolute;inset:14%;width:72%;height:72%;filter:drop-shadow(0 2px 1px #0005)}
.brick{inset:1%!important;border-radius:9%;background:repeating-linear-gradient(180deg,#0000 0 30%,#0002 30% 34%),linear-gradient(var(--k1),var(--k2));box-shadow:inset 0 -.25em 0 #0003,inset 0 .16em 0 #fff5,0 2px 2px #0004}
.brick::after{content:"";position:absolute;left:18%;right:18%;top:38%;height:24%;border-radius:30%;background:#00000018;box-shadow:inset 0 .08em 0 #0002,0 .06em 0 #fff3}
.brick.hp3{--k1:#ff6a5a;--k2:#c4201a}.brick.hp2{--k1:#ffa64a;--k2:#d86a10}.brick.hp1{--k1:#ffe066;--k2:#d9a400}
.bag svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0006)}
.pump{inset:3%!important;border-radius:46% 46% 42% 42%;background:radial-gradient(ellipse 22% 48% at 50% 55%,#ffb347,#0000 70%),repeating-linear-gradient(90deg,#f08a1a 0 14%,#ffa23a 14% 24%,#d9700a 24% 28%);box-shadow:inset 0 -.3em 0 #b8560044,inset 0 .2em 0 #fff6,0 2px 2px #0004}
.pump::before{content:"";position:absolute;left:44%;top:-8%;width:12%;height:20%;border-radius:30%;background:#3f8a2a;box-shadow:.12em .05em 0 -.02em #5fb03a}
.pump.hp1{background:radial-gradient(circle at 50% 58%,#fff7b0 0 18%,#ffcf40 30%,#0000 60%),repeating-linear-gradient(90deg,#f08a1a 0 14%,#ffa23a 14% 24%,#d9700a 24% 28%);box-shadow:0 0 .5em #ffd040,inset 0 .2em 0 #fff6}
.vial{inset:6% 22%!important;border-radius:20% 20% 36% 36%/12% 12% 26% 26%;background:linear-gradient(90deg,#ffffff55,#ffffff11 40%,#ffffff44),linear-gradient(#0000 34%,#c45cff 34%);box-shadow:inset 0 0 0 .1em #e8f6ff,0 2px 2px #0004}
.vial::before{content:"";position:absolute;left:18%;right:18%;top:-6%;height:14%;border-radius:20%;background:#c98a4a}
.metal{inset:1%!important;border-radius:10%;background:linear-gradient(150deg,#f2f6fa,#b9c6d3 50%,#8796a6);box-shadow:inset 0 -.25em 0 #0003,inset 0 .15em 0 #fff,0 2px 2px #0004}
.metal::before{content:"";position:absolute;inset:12%;background:radial-gradient(circle,#6a7a8a 0 18%,#0000 22%) 0 0/50% 50%;opacity:.8}
.mud{inset:3%!important;border-radius:50%;background:radial-gradient(circle at 50% 50%,#7a4a1e 0 5%,#f0c98a 6% 13%,#d9a464 14% 17%,#f2cf95 18% 27%,#d4a060 28% 31%,#eec58a 32% 42%,#cf9a58 43% 46%,#e8bd80 47% 58%,#6b3e18 60% 66%,#8a5428 67% 100%);box-shadow:inset 0 -.18em 0 #0003,inset 0 .1em 0 #ffffff40,0 3px 3px #0005}
.mud::after{content:"";position:absolute;left:58%;top:20%;width:6%;height:26%;border-radius:3px;background:#a8703a;transform:rotate(25deg);opacity:.7}
.timer{inset:6%!important;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a7488,#2b3040 60%,#151820);box-shadow:inset 0 -.2em 0 #0006,0 2px 3px #0006}
.timer::before{content:"";position:absolute;right:4%;top:-10%;width:22%;height:22%;border-radius:50%;background:#ffcf2e;box-shadow:0 0 .4em #ff9a1a}
.timer b{position:absolute;inset:26%;border-radius:30%;background:#fff;color:#c0201a;font-weight:900;font-size:calc(var(--cell)*.26);display:flex;align-items:center;justify-content:center}
.timer.low{animation:bump .6s infinite}
.hive{border-radius:46% 46% 34% 34%;background:repeating-linear-gradient(180deg,#ffd05a 0 17%,#e8901a 17% 21%);box-shadow:inset 0 -.25em 0 #0003,inset 0 .2em 0 #fff6,0 2px 2px #0003}
.hive i{position:absolute;left:36%;top:44%;width:28%;height:24%;border-radius:50%;background:#5a2c00}
.hive.hp1{filter:saturate(.6) brightness(.95)}
.cage{inset:2%!important;border-radius:10%;background:#2a3348cc;box-shadow:inset 0 0 0 .14em #9fb0c8}
.cage svg{position:absolute;inset:12%;width:76%;height:76%}
.cage::after{content:"";position:absolute;inset:0;border-radius:10%;background:repeating-linear-gradient(90deg,transparent 0 17%,#c9d6e8 17% 23%);box-shadow:inset 0 .3em 0 #e64a8a}
.toy svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px #0006)}
.toy{animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(8deg)}}
/* effets */
.fx-line{position:absolute;background:linear-gradient(90deg,transparent,#fff 15%,#ffe36a 50%,#fff 85%,transparent);box-shadow:0 0 18px #ffe36a;border-radius:20px;animation:lineH .42s forwards}
.fx-line.v{background:linear-gradient(180deg,transparent,#fff 15%,#ffe36a 50%,#fff 85%,transparent);animation:lineV .42s forwards}
@keyframes lineH{0%{transform:scaleX(.05);opacity:1}60%{opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes lineV{0%{transform:scaleY(.05);opacity:1}60%{opacity:1}100%{transform:scaleY(1);opacity:0}}
.fx-boom{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff,#ffd23a 35%,#ff6a1a 60%,transparent 70%);animation:boom .45s forwards}
@keyframes boom{0%{transform:scale(.1);opacity:1}100%{transform:scale(1);opacity:0}}
.part{position:absolute;width:13px;height:13px;border-radius:3px;animation:part .55s cubic-bezier(.2,.6,.4,1) forwards;box-shadow:inset 0 -3px 0 #0003}
@keyframes part{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.flyer{position:fixed;font-size:28px;z-index:50;transition:all .7s cubic-bezier(.4,-0.3,.6,1);pointer-events:none;width:32px;height:32px}
.flyer svg{width:100%;height:100%}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:42px;font-weight:900;color:#fff;text-shadow:0 4px 0 #c74b14,0 0 20px #000a;pointer-events:none;opacity:0;transform:scale(.5);transition:all .3s;z-index:6}
#banner.show{opacity:1;transform:scale(1)}
#tip{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:14px;font-weight:800;font-size:16px;white-space:nowrap;z-index:6}
/* barre des boosters */
.bbar{display:flex;gap:5px;justify-content:center;align-items:center;padding:10px 6px calc(env(safe-area-inset-bottom) + 12px);background:#2c6f80;box-shadow:0 -4px 0 #173f4a}
.bst{flex:1;max-width:60px;aspect-ratio:1;border-radius:14px;border:none;background:linear-gradient(#7fdc5a,#46ad2c);box-shadow:inset 0 -5px 0 #2f8017;font-size:28px;position:relative;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.bst.on{background:linear-gradient(#ffd36a,#ff9c1a);box-shadow:inset 0 -5px 0 #c86a00,0 0 0 3px #fff}
.bst .n{position:absolute;right:-3px;bottom:-5px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:#fff;color:#2f6a12;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #0003}
.bst .n.plus{background:#ffcf2e;color:#6a4100}

function procLayout(R){

   if(above&&isMov(above)){G.grid[r][c]=above;G.grid[a][c]=null;moved=true;continue}
   if(!above)continue;

   for(const dc of order){const c2=c+dc,r2=r-1;if(r2<0||c2<0||c2>=COLS||!G.mask[r2][c2])continue;const t2=G.grid[r2][c2];if(!isMov(t2))continue;

 els.forEach(e=>e.remove());els.clear();$('fx').innerHTML='';
 let resumed=false;
 if(S.cur&&S.cur.level===L&&S.cur.ver===3){const c=S.cur;let mx=0;const grid=c.grid.map(row=>row.map(t=>{if(!t)return null;const o={id:t.id,t:t.t};if(t.c!==undefined&&t.c!==null)o.c=t.c;if(t.hp!==undefined&&t.hp!==null)o.hp=t.hp;mx=Math.max(mx,t.id);return o}));nid=mx+1;
  G={ver:3,level:L,nC:c.nC,mask:c.mask,grid,moves:c.moves,startMoves:c.startMoves,goals:c.goals,goalStart:c.goalStart||c.goals.reduce((s,g)=>s+g.n,0),score:c.score||0};resumed=c.moves<c.startMoves}
 else{G=genLevel(L);S.cur=null;gravity();
  if(pick){const cand=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(isCube(G.grid[r][c]))cand.push([r,c]);
   const put=t=>{if(!cand.length)return;const i=Math.floor(Math.random()*Math.min(cand.length,24));const [r,c]=cand.splice(i,1)[0];G.grid[r][c]=mk(t)};
   if(pick.rk){put('rh');put('rv')}if(pick.bm)put('bomb');if(pick.dc){put('disco')}}}
 G.busy=false;G.over=false;G.booster=null;
 $('map').classList.add('hidden');$('game').classList.remove('hidden');
 $('lvlNum').textContent=L;$('game').style.background='radial-gradient(ellipse 60% 40% at 10% 90%,#ffb35a33,transparent 70%) no-repeat,radial-gradient(circle at 15% 25%,#ffffff10 0 50px,transparent 51px) 0 0/180px 180px,'+BGS[L%BGS.length]+' no-repeat';$('game').style.backgroundSize='100% 100%,180px 180px,100% 100%';$('mascotFace').innerHTML=MASCOT;drawGoals();updMoves();updBar();drawBoosters();tip('');
 if(!FAST&&history.state!=='game')history.pushState('game','');
 const go=()=>{layout();if(!hasMove())shuffle().then(hints);else hints();saveCur();banner(resumed?'C\'est reparti !':'TNT activée !')};
 if(FAST)go();else requestAnimationFrame(go)}
function showMap(){G=null;$('game').classList.add('hidden');$('map').classList.remove('hidden');renderMap()}
function renderMap(){
 $('coinsMap').textContent=S.coins;$('btnPlay').textContent='Jouer — Niveau '+S.level;
 $('bonusDot').classList.toggle('hidden',S.bonusDay===today());
 const L=S.level,from=Math.max(1,L-4),to=L+7,n=to-from+1,step=118,H=n*step+140;
 const p=$('path');p.style.height=H+'px';const W=p.clientWidth||360;
 const pts=[];for(let i=0;i<n;i++){const lv=from+i;const y=H-90-i*step;const x=W*(.56+.26*Math.sin(i*1.05));pts.push([x,y,lv])}
 let h=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="#ffffff55" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 22"/></svg>`;
 for(const [x,y,lv] of pts){const cls=lv<L?'done':lv===L?'cur':'lock';const st=lv<L?'⭐'.repeat(S.stars[lv]||3):'';
  h+=`<button class="node ${cls}" style="left:${x}px;top:${y}px" data-lv="${lv}">${lv===L?'▶':''}${st?`<span class="st">${st}</span>`:''}<span class="lbl">${lv}</span></button>`}
 p.innerHTML=h;
 p.querySelectorAll('.node.cur').forEach(b=>b.onclick=()=>preLevel(S.level));
 const cur=pts.find(q=>q[2]===L);requestAnimationFrame(()=>{$('mapScroll').scrollTop=cur[1]-$('mapScroll').clientHeight/2})}

/* ====================== FENÊTRES ====================== */
function modal(html){$('modalBox').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function confirmBox(txt,okLabel,ok){modal(`<h2>Confirmer</h2><p>${txt}</p><button class="btn red" id="cOk">${okLabel}</button><button class="btn grey" id="cNo">Annuler</button>`);$('cOk').onclick=()=>{closeModal();ok()};$('cNo').onclick=closeModal}
function helpMenu(){
 const row=(ic,t)=>`<div><span class="gi">${ic}</span><span>${t}</span></div>`;
 modal(`<h2>Règles</h2><div class="help">
 ${row('<div class="cube" style="--a:#ff9a8a;--b:#f23b3b;--d:#b01818"></div>','Touche 2 cubes ou plus de la même couleur collés.')}
 ${row(`<div class="sp">${ROCKET}</div>`,'5 ou 6 cubes = <b>fusée</b> : vide une ligne ou une colonne.')}
 ${row(`<div class="sp">${BOMB}</div>`,'7 ou 8 cubes = <b>TNT</b> : grosse explosion autour d\'elle.')}
 ${row('<div class="disco"></div>','9 cubes ou plus = <b>boule arc-en-ciel</b> : enlève toute une couleur.')}
 ${row('<div class="tnt"><span style="font-size:10px">TNT</span></div>','Une <b>TNT</b> est posée au départ de chaque niveau.')}
 <p style="font-size:16px;margin:6px 0"><b>Combos :</b> touche un spécial collé à un autre spécial. Fusée + fusée = une ligne et une colonne en croix. Fusée + TNT = 3 lignes et 3 colonnes. TNT + TNT = énorme explosion (9 × 9), presque tout le plateau. Arc-en-ciel + fusée = tous les cubes de sa couleur deviennent des fusées. Arc-en-ciel + TNT = ils deviennent tous des TNT. Arc-en-ciel + arc-en-ciel = tout le plateau.</p>
 ${row('<div class="stone hp1"></div>','<b>Pierre</b> : bloque le passage, casse-la en faisant exploser à côté.')}
 ${row(`<div class="gemst">${GEM}</div>`,'<b>Pierre à diamant</b> : casse-la pour ramasser le diamant.')}
 ${row('<div class="brick hp3"></div>','<b>Brique</b> : rouge = 3 couches, orange = 2, jaune = la dernière.')}
 ${row('<div class="safe hp2"><i></i></div>','<b>Coffre-fort</b> : 2 coups, il libère un sac d\'argent.')}
 ${row(`<div class="bag">${BAG}</div>`,'<b>Sac d\'argent</b> : fais-le descendre tout en bas pour le ramasser.')}
 ${row('<div class="hive"><i></i></div>','<b>Ruche</b> : chaque coup libère une abeille 🐝.')}
 ${row('<div class="pump hp2"></div>','<b>Citrouille</b> : 1 coup l\'allume, le 2e la ramasse.')}
 ${row('<div class="vial"></div>','<b>Fiole</b> : 1 coup pour la ramasser.')}
 ${row('<div class="metal"></div>','<b>Bloc en métal</b> : seuls les fusées, TNT et arc-en-ciel le cassent.')}
 ${row('<div class="mud" style="border-radius:20%"></div>','<b>Rondin de bois</b> : casse-le en faisant exploser à côté.')}
 ${row('<div class="timer"><b style="font-size:10px">9</b></div>','<b>Bombe à minuterie</b> (dans les rondins) : désamorce-la avant que le chiffre arrive à 0 !')}
 <p style="font-size:16px;margin:6px 0">Les obstacles ne bougent pas : les cubes coulent autour, même en biais.</p>
 </div><button class="btn" id="hOk">Compris</button>`);$('hOk').onclick=closeModal}
function bonusMenu(){
 if(S.bonusDay===today()){modal(`<h2>Bonus du jour</h2><p>Tu as déjà pioché aujourd'hui.<br>Reviens demain pour une autre récompense !</p><button class="btn" id="mOk">OK</button>`);$('mOk').onclick=closeModal;return}
 const pool=[{b:'hammer',n:1},{b:'row',n:1},{b:'col',n:1},{b:'bucket',n:1},{coins:10},{b:'paint',n:1},{b:'hammer',n:2},{b:'shuffle',n:1},{coins:25}];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const lab=x=>x.coins?`🪙<small>+${x.coins}</small>`:`<div style="width:60%;height:40%">${BOOSTERS.find(b=>b.k===x.b).ic}</div><small>+${x.n}</small>`;
 modal(`<h2>Bonus du jour !</h2><div class="cards">${pool.map((x,i)=>`<button class="card" data-i="${i}">?</button>`).join('')}</div><p id="bTxt">Pioche une carte pour obtenir ta récompense !</p><button class="btn hidden" id="bOk">Récupérer</button>`);
 let picked=false;
 document.querySelectorAll('.card').forEach(cd=>cd.onclick=()=>{if(picked)return;picked=true;const i=+cd.dataset.i,x=pool[i];
  cd.classList.add('rev','mine');cd.innerHTML=lab(x);snd('coin');
  if(x.coins)S.coins+=x.coins;else S.boost[x.b]=(S.boost[x.b]||0)+x.n;S.bonusDay=today();save();
  setTimeout(()=>{document.querySelectorAll('.card').forEach(o=>{if(o===cd)return;o.classList.add('rev','dim');o.innerHTML=lab(pool[+o.dataset.i])});$('bTxt').textContent='Reviens demain pour une autre récompense !';$('bOk').classList.remove('hidden')},600)});
 $('bOk').onclick=()=>{closeModal();renderMap()}}
function shopMenu(){
 const draw=()=>{modal(`<h2>Boutique</h2><p style="margin:0 0 6px">Tu as <b>${S.coins}</b> <span class="coin" style="vertical-align:middle;width:20px;height:20px"></span></p>`+BOOSTERS.map(b=>`<div class="shopRow"><div class="ico">${b.ic}</div><div class="txt">${b.name} <small>${b.desc} — tu en as ${S.boost[b.k]||0}</small></div><button data-k="${b.k}" ${S.coins<PRICE?'disabled style="opacity:.45"':''}>${PRICE} 🪙</button></div>`).join('')+PRE.map(b=>`<div class="shopRow"><div class="ico" style="position:relative">${b.html()}</div><div class="txt">${b.name} <small>Bonus de départ — tu en as ${S.pre[b.k]||0}</small></div><button data-p="${b.k}" ${S.coins<PRICE?'disabled style="opacity:.45"':''}>${PRICE} 🪙</button></div>`).join('')+`<button class="btn blue" id="sOk">Fermer</button>`);
  document.querySelectorAll('.shopRow button[data-p]').forEach(b=>b.onclick=()=>{if(S.coins<PRICE)return;S.coins-=PRICE;S.pre[b.dataset.p]=(S.pre[b.dataset.p]||0)+1;save();snd('coin');draw()});
  document.querySelectorAll('.shopRow button[data-k]').forEach(b=>b.onclick=()=>{if(S.coins<PRICE)return;S.coins-=PRICE;S.boost[b.dataset.k]=(S.boost[b.dataset.k]||0)+1;save();snd('coin');draw()});
  $('sOk').onclick=()=>{closeModal();renderMap()}};draw()}
function settingsMenu(){
 const draw=()=>{modal(`<h2>Réglages</h2>
 <div class="row">Son<button class="sw ${S.sound?'on':''}" id="tS"></button></div>
 <div class="row">Vibrations<button class="sw ${S.vibe?'on':''}" id="tV"></button></div>
 <div class="row" style="flex-direction:column;align-items:stretch">Aller au niveau :<input type="number" id="lvIn" value="${S.level}" inputmode="numeric"><button class="btn blue" id="lvGo" style="margin-top:8px">Aller à ce niveau</button></div>
 <p style="font-size:15px;margin:14px 0 0">Ta partie se sauvegarde toute seule sur ton téléphone. Pour ne jamais la perdre, garde aussi une copie :</p>
 <button class="btn" id="bDl">💾 Télécharger ma sauvegarde</button>
 <button class="btn blue" id="bSh">📤 Envoyer ma sauvegarde (Drive…)</button>
 <button class="btn grey" id="bRe">📥 Restaurer une sauvegarde</button>
 <button class="btn blue" id="bClose">Fermer</button>`);
 $('tS').onclick=()=>{S.sound=!S.sound;save();draw()};$('tV').onclick=()=>{S.vibe=!S.vibe;save();draw()};
 $('lvGo').onclick=()=>{const v=parseInt($('lvIn').value,10);if(!(v>=1&&v<1e7))return toast('Numéro invalide');confirmBox(`Aller au niveau ${v} ?<br><small>Le niveau en cours sera abandonné.</small>`,'Oui, y aller',()=>{S.level=v;S.cur=null;save();renderMap();toast('Niveau '+v)})};
 $('bDl').onclick=()=>{const blob=backupBlob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=backupName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Sauvegarde téléchargée')};
 $('bSh').onclick=async()=>{try{const f=new File([backupBlob()],backupName(),{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Sauvegarde Cube Boum'})}else toast('Utilise « Télécharger »')}catch(e){}};
 $('bRe').onclick=()=>$('fileIn').click();
 $('bClose').onclick=()=>{closeModal();renderMap()}};draw()}
const backupName=()=>'cube-boum-sauvegarde-'+today()+'.json';
const backupBlob=()=>new Blob([JSON.stringify(Object.assign({app:'cubeboum'},S))],{type:'application/json'});
$('fileIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.v||!d.level)throw 0;
 confirmBox(`Restaurer cette sauvegarde ?<br><small>Niveau ${d.level}, ${d.coins} pièces. Ta partie actuelle sera remplacée.</small>`,'Restaurer',()=>{delete d.app;S=Object.assign(defSave(),d);S.boost=Object.assign(defSave().boost,d.boost);if(S.cur&&S.cur.ver!==3)S.cur=null;save();renderMap();toast('Sauvegarde restaurée')})}catch(err){toast('Fichier non reconnu')}};rd.readAsText(f)};

/* ====================== DÉMARRAGE ====================== */
$('board').addEventListener('pointerdown',boardTap);
$('btnPlay').onclick=()=>preLevel(S.level);
$('btnBonus').onclick=bonusMenu;$('btnShop').onclick=shopMenu;$('btnSettings').onclick=settingsMenu;$('btnHelp').onclick=helpMenu;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal')&&!G?.over)closeModal()});
window.addEventListener('resize',()=>{if(G)layout();else renderMap()});
window.addEventListener('popstate',()=>{if(!$('modal').classList.contains('hidden')&&!(G&&G.over)){closeModal();if(G)history.pushState('game','');return}if(G&&!G.busy){showMap()}else if(G){history.pushState('game','')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
renderMap();
if(!S.helpSeen){S.helpSeen=1;save();setTimeout(helpMenu,400)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
