name: Le Rami - appli Android (APK)
on:
  push:
    branches: [main]
    paths:
      - 'android-rami/**'
      - '.github/workflows/rami-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Clé de signature (créée sur place, jamais enregistrée dans le dépôt)
        run: keytool -genkeypair -keystore android-rami/app/rami.keystore -storepass "$KS" -keypass "$KS" -alias rami -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Rami, C=FR"
        env:
          KS: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fabriquer l'APK
        env:
          VC: ${{ github.run_number }}
          VN: ${{ github.run_number }}
          KS: ${{ github.run_id }}-${{ github.run_attempt }}
        run: gradle -p android-rami assembleRelease --no-daemon
      - name: Publier LeRami.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-rami/app/build/outputs/apk/release/app-release.apk LeRami.apk
          gh release view rami >/dev/null 2>&1 || gh release create rami --title "Le Rami (appli Android)" --notes "Appli Le Rami à installer sur le téléphone."
          gh release upload rami LeRami.apk --clobber
